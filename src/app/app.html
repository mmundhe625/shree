<div class="root" [class.dark-mode]="darkMode()">
  <div class="layout">
    <aside class="sb">
      <div class="sb-inner">
        <div class="logo">
          <img src="/images/logo1.png" alt="Logo" class="logo-img">
          
        </div>
        <nav class="nav">
          <a routerLink="/home" class="nav-item" routerLinkActive="nav-item-active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Home" title="Home"><i class="fa-solid fa-house icon"></i></a>
          <a routerLink="/dashboard" class="nav-item" routerLinkActive="nav-item-active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Dashboard" title="Dashboard"><i class="fa-solid fa-chart-pie icon"></i></a>
          <a routerLink="/bills" class="nav-item" routerLinkActive="nav-item-active"><i class="fa-solid fa-shapes icon"></i></a>
          <a routerLink="/client" class="nav-item" routerLinkActive="nav-item-active"><i class="fa-solid fa-users icon"></i></a>
        </nav>
      </div>
      <div>
        <a href="" class="nav-item"><i class="fa-solid fa-circle-info icon"></i></a>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="hd">
        <div class="hd-left">
          <button class="btn-icon"><i class="fa-solid fa-bars"></i></button>
          <span class="header-title">Construction Operations</span>
        </div>

        <div class="hd-right">
          <button class="btn-icon theme-toggle" type="button" (click)="toggleTheme()" [attr.aria-label]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'" [attr.title]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'" [attr.aria-pressed]="darkMode()">
            <i class="fa-solid" [class.fa-sun]="darkMode()" [class.fa-moon]="!darkMode()"></i>
          </button>
          <button class="btn-icon"><i class="fa-solid fa-grid-3x3-gap"></i></button>
          <button class="btn-notify">
            <i class="fa-solid fa-bell"></i>
            <span class="badge"></span>
          </button>
          <div class="avatar-wrap">
            <img src="/images/logo.jpg" alt="Avatar" class="avatar">
          </div>
        </div>
      </header>

      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
